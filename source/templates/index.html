<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Flight CSV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('static/images/background.gif'); 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            opacity: 0.9; 
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        input[type="file"] {
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .message {
            margin-top: 20px;
            text-align: center;
            font-size: 16px;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
        .navigate-button {
            margin-top: 20px;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .navigate-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload Flight CSV</h1>
        <form id="uploadForm">
            <input type="file" id="fileInput" accept=".csv" required>
            <button type="submit">Upload</button>
        </form>
        <div class="message" id="message"></div>
        <button class="navigate-button" onclick="window.location.href='flight'">Go to Flight Page</button>
    </div>

    <script>
        const uploadForm = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const messageDiv = document.getElementById('message');
        const apiUrl = 'http://127.0.0.1:5000/upload'; 

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault(); 

            const file = fileInput.files[0];
            if (!file) {
                showMessage('Please select a file to upload.', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    body: formData,
                });

                if (response.ok) {
                    const data = await response.json();
                    showMessage(data.message || 'File uploaded successfully!', 'success');
                } else {
                    const errorData = await response.json();
                    showMessage(errorData.error || 'An error occurred during upload.', 'error');
                }
            } catch (error) {
                showMessage('Failed to connect to the server. Please try again later.', 'error');
            }
        });

        function showMessage(message, type) {
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
        }
    </script>
</body>
</html>
